<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180" fill="none">
  <!-- Solid bg: iOS strips alpha. Use the brand-defining evergreen-black fill. -->
  <rect width="180" height="180" fill="#0e1512"/>
  <!-- Inner card: same shape as the in-app logo, scaled 3.5x and centered with a 22px safe area. -->
  <rect x="34" y="34" width="112" height="112" rx="24" fill="#18211d" stroke="#2f9e6f" stroke-width="5"/>
  <!-- Glyph: chevron + horizontal rule, scaled 3.5x relative to 32-coord master. -->
  <path d="M62 72.5l14 17.5-14 17.5" stroke="#43c08a" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M86.5 111H118" stroke="#d9b380" stroke-width="8" stroke-linecap="round"/>
</svg>
