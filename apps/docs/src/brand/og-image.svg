<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" fill="none">
  <!-- Background -->
  <rect width="1200" height="630" fill="#0e1512"/>

  <!-- Subtle frame hairlines -->
  <line x1="0" y1="60" x2="1200" y2="60" stroke="#1d2823" stroke-width="1"/>
  <line x1="0" y1="570" x2="1200" y2="570" stroke="#1d2823" stroke-width="1"/>

  <!-- Accent bar top-left -->
  <rect x="60" y="60" width="80" height="2" fill="#2f9e6f"/>

  <!-- Logo centered, scaled 3.75x (32 * 3.75 = 120). Centered at x=540, y=170. -->
  <g transform="translate(540 170) scale(3.75)">
    <rect x="0.75" y="0.75" width="30.5" height="30.5" rx="6.5" fill="#18211d" stroke="#2f9e6f" stroke-width="1.5"/>
    <path d="M8 11l4 5-4 5" stroke="#43c08a" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M15 22h9" stroke="#d9b380" stroke-width="2.25" stroke-linecap="round"/>
  </g>

  <!-- Wordmark -->
  <text x="600" y="430"
        text-anchor="middle"
        font-family="ui-monospace, 'JetBrains Mono', Menlo, Consolas, monospace"
        font-size="128"
        font-weight="700"
        fill="#eef4f0"
        letter-spacing="-4">kit</text>

  <!-- Tagline -->
  <text x="600" y="490"
        text-anchor="middle"
        font-family="system-ui, 'Inter', -apple-system, BlinkMacSystemFont, sans-serif"
        font-size="30"
        font-weight="400"
        fill="#93a59c">Foundation packages for side projects</text>

  <!-- Footer URL -->
  <text x="600" y="540"
        text-anchor="middle"
        font-family="ui-monospace, 'JetBrains Mono', Menlo, Consolas, monospace"
        font-size="22"
        font-weight="500"
        fill="#2f9e6f"
        letter-spacing="-0.5">kit.arshadshah.com</text>
</svg>
