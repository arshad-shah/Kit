name: Release

on:
  push:
    branches: [master]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  id-token: write   # required for OIDC trusted publishing

jobs:
  release:
    name: Version and release
    runs-on: ubuntu-latest
    # Gated environment so npm publishes can be reviewed (and audited via the
    # Deployments view) before they happen. Configure required reviewers on
    # the `npm-publish` environment in repo settings.
    environment:
      name: npm-publish
      url: https://www.npmjs.com/~arshad-shah
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # Full history needed for changesets to detect changed packages
          fetch-depth: 0

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: pnpm
          # Setting registry-url enables npm to detect OIDC environment.
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all packages
        run: pnpm build

      - name: Run tests
        run: pnpm test

      # npm OIDC trusted publishing requires npm >= 11.5.1. The npm bundled with
      # Node 22 is older, so we pin a known-good version here. Bump deliberately.
      - name: Pin npm to OIDC-supporting version
        run: npm install -g npm@11.5.1

      - name: Create release PR or publish to npm
        id: changesets
        uses: changesets/action@63a615b9cd06ba9a3e6d13796c7fbcb080a60a0b # v1.8.0
        with:
          # `pnpm run` is required so pnpm invokes the package.json `version`
          # script (`changeset version && pnpm install --lockfile-only`).
          # Plain `pnpm version` is pnpm's built-in command, which only prints
          # runtime versions and does not consume changesets.
          version: pnpm run version
          publish: pnpm run release
          commit: "chore: version packages"
          title: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Enables npm to embed provenance attestation via OIDC.
          NPM_CONFIG_PROVENANCE: "true"
          # No NPM_TOKEN here - OIDC handles auth via id-token: write permission.
          # In npm, configure trusted publishers for each package pointing at this
          # repo + workflow. See: https://docs.npmjs.com/trusted-publishers

      - name: Notify on publish
        if: steps.changesets.outputs.published == 'true'
        run: |
          echo "Published packages:"
          echo '${{ steps.changesets.outputs.publishedPackages }}'
